<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="قاعات وممرات الحرم">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".24"/></filter>
  </defs>
  <rect width="900" height="600" fill="url(#g)"/>
  <rect width="900" height="600" fill="url(#grid)" opacity=".7"/>
  <circle cx="110" cy="92" r="140" fill="rgba(255,255,255,.12)"/>
  <circle cx="805" cy="510" r="190" fill="rgba(255,255,255,.10)"/>
  <rect x="120" y="120" width="660" height="360" rx="42" fill="rgba(255,255,255,.15)" filter="url(#shadow)"/>
  <text x="450" y="245" text-anchor="middle" font-family="Arial, Tahoma, sans-serif" font-size="92" fill="#ffffff">🏛</text>
  <text x="450" y="332" text-anchor="middle" font-family="Arial, Tahoma, sans-serif" font-size="42" font-weight="700" fill="#ffffff" direction="rtl">قاعات وممرات الحرم</text>
  <text x="450" y="382" text-anchor="middle" font-family="Arial, Tahoma, sans-serif" font-size="24" fill="rgba(255,255,255,.86)" direction="rtl">بيئة جامعية حديثة</text>
</svg>